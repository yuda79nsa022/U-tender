server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing -- any path that isn't a real
    # static file (e.g. /owner/dashboard) must still get index.html so the
    # app's own router can render it, instead of nginx 404ing on a path
    # that only exists in the SPA's route table.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets are content-hashed by Vite (e.g. index-abc123.js), so
    # they're safe to cache aggressively -- a new deploy ships a new
    # filename, never a stale one under an old name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
